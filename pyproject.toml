[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glimpse-markets"
dynamic = ["version"]
description = "Official Python client for the Glimpse Nmarket prediction-market API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ritankar Saha", email = "ritankar.saha786@gmail.com" }]
requires-python = ">=3.10"
keywords = ["glimpse", "prediction-markets", "trading", "trading-bot", "lmsr", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "websockets>=13",
]

[project.urls]
Homepage = "https://docs.glimpse.markets"
Documentation = "https://docs.glimpse.markets"
Repository = "https://github.com/BIRKELAND-GLIMPSE/python-package"
Issues = "https://github.com/BIRKELAND-GLIMPSE/python-package/issues"

[project.scripts]
glimpse = "glimpse_markets.cli:main"

[project.optional-dependencies]
forecasting = [
    "timesfm[torch]>=2.0",
]
yfinance = [
    # Convenience only -- Yahoo's finance data is personal-use-only per
    # yfinance's own README. See forecasting/sources.py before using this.
    "yfinance>=0.2",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glimpse_markets"]

[tool.hatch.version]
path = "src/glimpse_markets/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["glimpse_markets"]

[tool.mypy]
python_version = "3.10"
packages = ["glimpse_markets"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# Optional 'forecasting' / 'yfinance' extras -- not installed by default,
# only needed to actually run TimesFMForecaster / fetch_yfinance_history
# (imports are lazy, see model.py / sources.py).
module = ["timesfm", "timesfm.*", "numpy", "numpy.*", "yfinance", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: hits the real Glimpse API (requires GLIMPSE_API_KEY); skipped by default",
]

[tool.coverage.run]
source = ["src/glimpse_markets"]
